<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Quiz App</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      .card {
        background: #fff;
        padding: 25px;
        border-radius: 12px;
        width: 320px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      h3 {
        margin-bottom: 20px;
      }

      button {
        display: block;
        width: 100%;
        margin: 8px 0;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
      }

      button:hover {
        transform: scale(1.03);
      }

      .answer {
        background: #f5f5f5;
      }

      .answer:nth-of-type(1) {
        border-left: 5px solid #3498db;
      }
      .answer:nth-of-type(2) {
        border-left: 5px solid #9b59b6;
      }
      .answer:nth-of-type(3) {
        border-left: 5px solid #e67e22;
      }
      .answer:nth-of-type(4) {
        border-left: 5px solid #2ecc71;
      }

      .correct {
        background: #2ecc71;
        color: #fff;
      }

      .wrong {
        background: #e74c3c;
        color: #fff;
      }

      #next {
        margin-top: 15px;
        background: #333;
        color: #fff;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3 id="question"></h3>
      <div id="answers"></div>

      <button id="next">Next</button>
    </div>

    <script>
      const questions = [
        { q: "What is 2+2?", answers: ["3", "4", "5", "6"], correct: 1 },
        {
          q: "Capital of France?",
          answers: ["Berlin", "Madrid", "Paris", "Rome"],
          correct: 2,
        },
        {
          q: "JS stands for?",
          answers: ["JavaSource", "JavaScript", "JustScript", "JScript"],
          correct: 1,
        },
        {
          q: "HTML is?",
          answers: [
            "Programming language",
            "Markup language",
            "Database",
            "OS",
          ],
          correct: 1,
        },
      ];
      // 1. تعريف المتغيرات لجلب عناصر الواجهة وتحديد السؤال الحالي
let currentQuestionIndex = 0;
const answersContainer = document.getElementById("answers");
const nextButton = document.getElementById("next");

// دوال جلب نص السؤال من الأستاذ (تأكد من وجود العنصر في الـ HTML لديك)
// الأستاذ يعتمد على البنية لطباعة السؤال، سنقوم بإنشاء دالة العرض:

function showQuestion() {
    // تفريغ الأزرار السابقة
    answersContainer.innerHTML = "";
    
    // جلب السؤال الحالي من مصفوفة الأستاذ
    const currentQuestion = questions[currentQuestionIndex];
    
    // طباعة نص السؤال (إذا كان لديك عنصر h3 أو h2 يحمل نص السؤال)
    // لنفرض أن نص السؤال يظهر في أعلى الكارد، سنقوم بتحديثه:
    const questionTextElement = document.querySelector(".card h3") || document.querySelector(".card h2");
    if(questionTextElement) {
        questionTextElement.innerText = currentQuestion.q;
    }

    // إنشاء أزرار الإجابات بناءً على مصفوفة الأستاذ
    currentQuestion.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.innerText = answer;
        button.classList.add("btn"); // تأكد أن الاسم يطابق كلاس الـ CSS للزر
        
        // عند الضغط على الإجابة
        button.addEventListener("click", () => checkAnswer(index, button));
        answersContainer.appendChild(button);
    });
    
    // إخفاء زر التالي في بداية السؤال
    nextButton.style.display = "none";
}

// 2. دالة التحقق من الإجابة (صح أم خطأ)
function checkAnswer(selectedIndex, clickedButton) {
    const currentQuestion = questions[currentQuestionIndex];
    const allButtons = answersContainer.querySelectorAll("button");
    
    // إذا كانت الإجابة صحيحة (تطابق رقم الـ correct عند الأستاذ)
    if (selectedIndex === currentQuestion.correct) {
        clickedButton.style.backgroundColor = "#28a745"; // لون أخضر
        clickedButton.style.color = "white";
    } else {
        clickedButton.style.backgroundColor = "#dc3545"; // لون أحمر
        clickedButton.style.color = "white";
        
        // إظهار الإجابة الصحيحة باللون الأخضر للمساعدة
        allButtons[currentQuestion.correct].style.backgroundColor = "#28a745";
        allButtons[currentQuestion.correct].style.color = "white";
    }
    
    // تعطيل باقي الأزرار بعد الإجابة
    allButtons.forEach(btn => btn.disabled = true);
    
    // إظهار زر التالي للانتقال
    nextButton.style.display = "block";
}

// 3. الانتقال للمهمة التالية عند الضغط على Next
nextButton.addEventListener("click", () => {
    currentQuestionIndex++;
    
    // التحقق إذا انتهت الأسئلة
    if (currentQuestionIndex < questions.length) {
        showQuestion();
    } else {
        // عرض النتيجة النهائية أو إعادة الكويز
        answersContainer.innerHTML = "<h3>تهانينا! لقد أتممت الاختبار.</h3>";
        nextButton.style.display = "none";
    }
});

// تشغيل الدالة لأول مرة عند فتح الصفحة
showQuestion();
    </script>
  </body>
</html>
